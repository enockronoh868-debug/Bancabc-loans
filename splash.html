<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BancABC</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #0066CC; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; overflow: hidden; }
        
        .logo-container { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
        .logo-text { font-size: 50px; font-weight: bold; letter-spacing: -1px; color: #003366; text-shadow: 1px 1px 0 white, -1px -1px 0 white, 1px -1px 0 white, -1px 1px 0 white;}
        .logo-gold { color: #FFD700; font-size: 50px; font-weight: bold; font-style: italic; }
        
        .bottom-bar { position: absolute; bottom: 40px; width: 80%; max-width: 300px; }
        .progress-track { width: 100%; height: 6px; background: rgba(255,255,255,0.3); border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: white; width: 0%; border-radius: 3px; animation: loadBar 3s linear forwards; }
        .status-text { text-align: center; font-size: 12px; margin-top: 10px; opacity: 0.8; }

        @keyframes loadBar {
            0% { width: 0%; }
            100% { width: 100%; }
        }
    </style>
</head>
<body>
    
    <div class="logo-container">
        <div class="logo-text">BancABC</div>
        <div class="logo-gold">A360</div>
    </div>

    <div class="bottom-bar">
        <div class="progress-track">
            <div class="progress-fill"></div>
        </div>
        <div class="status-text">Loading your experience...</div>
    </div>

    <script>
        setTimeout(function() {
            window.location.href = 'index.html';
        }, 3000);
    </script>
</body>
</html>
