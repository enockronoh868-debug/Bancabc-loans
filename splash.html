<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BancABC</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #0066CC; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; overflow: hidden; }
        
        .logo-img { max-width: 250px; height: auto; margin-bottom: 20px; }
        
        .bottom-bar { position: absolute; bottom: 40px; width: 80%; max-width: 300px; }
        .progress-track { width: 100%; height: 6px; background: rgba(255,255,255,0.3); border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: white; width: 0%; border-radius: 3px; animation: loadBar 3s linear forwards; }
        .status-text { text-align: center; font-size: 12px; margin-top: 10px; opacity: 0.8; }

        @keyframes loadBar {
            0% { width: 0%; }
            100% { width: 100%; }
        }
    </style>
</head>
<body>
    
    <img src="logo.png" alt="BancABC Logo" class="logo-img">

    <div class="bottom-bar">
        <div class="progress-track">
            <div class="progress-fill"></div>
        </div>
        <div class="status-text">Loading your experience...</div>
    </div>

    <script>
        setTimeout(function() {
            window.location.href = 'login.html';
        }, 3000);
    </script>
</body>
</html>
